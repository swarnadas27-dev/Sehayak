<!-- Shared Interactive Online Exercise Mini-Lab Modal (Student & Parent Portals) -->
<div id="online-lab-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="online-lab-title"
     style="display: none; position: fixed; inset: 0; background: rgba(1, 70, 60, 0.55); z-index: 120; align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: #FDF7EF; border: 3px solid #01463C; border-radius: 28px; box-shadow: 0 8px 0 #01463C; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.75rem 2rem; position: relative;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1rem;">
            <div>
                <span class="role-badge-tag" style="background: #1EACB0; color: #FFFFFF; margin-bottom: 0.35rem;">Interactive Online Practice</span>
                <h3 id="online-lab-title" style="font-size: 1.4rem; font-weight: 800; color: #01463C; margin: 0.15rem 0 0;">Online Exercise</h3>
            </div>
            <button type="button" id="online-lab-close" class="btn btn-secondary" style="padding: 0.35rem 0.9rem; font-size: 0.85rem; border-radius: 9999px;">
                Close
            </button>
        </div>

        <p id="online-lab-goal" style="font-size: 0.94rem; color: #1F5F55; margin-bottom: 1rem; line-height: 1.5;"></p>

        <!-- Dynamic Interactive Canvas -->
        <div id="online-lab-body" style="background: #FFFFFF; border: 2px solid #01463C; border-radius: 20px; padding: 1.35rem; margin-bottom: 1.1rem;"></div>

        <!-- Feedback Strip -->
        <div id="online-lab-feedback" style="display: none; border: 2px solid #01463C; border-radius: 14px; padding: 0.85rem 1rem; margin-bottom: 1rem; font-weight: 700; font-size: 0.92rem;"></div>

        <!-- Reference & Completion Footer -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; border-top: 2px dashed #01463C; padding-top: 1rem;">
            <div id="online-lab-ref-box" style="font-size: 0.82rem; color: #1F5F55;"></div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <a id="online-lab-ext-link" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="display: none; font-size: 0.84rem; padding: 0.45rem 0.95rem;">
                    Open External Interactive App &rarr;
                </a>
                <button type="button" id="online-lab-complete-btn" class="btn btn-doorbell" style="font-size: 0.86rem; padding: 0.5rem 1.2rem;">
                    Complete &amp; Log Practice (+1)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const modal = document.getElementById("online-lab-modal");
    const closeBtn = document.getElementById("online-lab-close");
    const titleEl = document.getElementById("online-lab-title");
    const goalEl = document.getElementById("online-lab-goal");
    const bodyEl = document.getElementById("online-lab-body");
    const feedbackEl = document.getElementById("online-lab-feedback");
    const refBoxEl = document.getElementById("online-lab-ref-box");
    const extLinkEl = document.getElementById("online-lab-ext-link");
    const completeBtn = document.getElementById("online-lab-complete-btn");

    if (!modal || !bodyEl) return;

    let activeExId = null;
    let activeTimerId = null;

    function clearFeedback() {
        feedbackEl.style.display = "none";
        feedbackEl.textContent = "";
    }

    function showFeedback(text, ok) {
        feedbackEl.style.display = "block";
        feedbackEl.style.background = ok ? "#ECFDF5" : "#FFF7E6";
        feedbackEl.style.color = ok ? "#065F46" : "#92400E";
        feedbackEl.textContent = text;
        if (ok && window.playPleasantChime) window.playPleasantChime();
    }

    function stopTimerIfRunning() {
        if (activeTimerId) {
            clearInterval(activeTimerId);
            activeTimerId = null;
        }
    }

    function closeLab() {
        stopTimerIfRunning();
        modal.style.display = "none";
    }

    closeBtn.addEventListener("click", closeLab);
    modal.addEventListener("click", function(e) {
        if (e.target === modal) closeLab();
    });

    // 1. Color-Chunk Word Problem Highlighter
    function renderChunkHighlighter() {
        const problems = [
            {
                tokens: [
                    { t: "Riya has", role: "plain" },
                    { t: "120 rupees.", role: "num" },
                    { t: "She spends", role: "plain" },
                    { t: "45 rupees", role: "num" },
                    { t: "on a notebook.", role: "plain" },
                    { t: "Find how much money is left.", role: "goal" }
                ]
            },
            {
                tokens: [
                    { t: "A rectangular garden is", role: "plain" },
                    { t: "8 cm", role: "num" },
                    { t: "long and", role: "plain" },
                    { t: "5 cm", role: "num" },
                    { t: "wide.", role: "plain" },
                    { t: "Find its total perimeter.", role: "goal" }
                ]
            }
        ];
        let pIdx = 0;
        let brush = "num";

        function draw() {
            const prob = problems[pIdx];
            bodyEl.innerHTML = `
                <div style="font-size: 0.86rem; font-weight: 800; color: #01463C; margin-bottom: 0.65rem;">
                    Step 1: Pick a color pen below, then tap words in the question box!
                </div>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
                    <button type="button" class="btn btn-secondary chunk-brush" data-brush="num" style="font-size: 0.82rem; padding: 0.35rem 0.8rem; background: #DCFCE7; border: 2px solid #01463C;">Green Pen: Numbers &amp; Units</button>
                    <button type="button" class="btn btn-secondary chunk-brush" data-brush="goal" style="font-size: 0.82rem; padding: 0.35rem 0.8rem; background: #DBEAFE; border: 2px solid #01463C;">Blue Pen: Question Goal</button>
                    <button type="button" id="chunk-next-prob" class="btn btn-secondary" style="font-size: 0.82rem; padding: 0.35rem 0.8rem;">Switch Word Problem</button>
                </div>
                <div id="chunk-tokens-area" style="display: flex; flex-wrap: wrap; gap: 0.45rem; padding: 1rem; background: #FDF7EF; border: 2px solid #01463C; border-radius: 14px; margin-bottom: 0.9rem; line-height: 2;">
                    ${prob.tokens.map((item, idx) => `<button type="button" class="chunk-tok" data-idx="${idx}" data-expected="${item.role}" data-marked="" style="font-size: 1.05rem; font-weight: 700; padding: 0.35rem 0.65rem; border-radius: 10px; border: 1.5px solid #01463C; background: #FFFFFF; color: #01463C; cursor: pointer;">${item.t}</button>`).join("")}
                </div>
                <button type="button" id="chunk-verify-btn" class="btn btn-doorbell" style="font-size: 0.86rem; padding: 0.45rem 1.1rem;">Check My Color Chunks</button>
            `;
            bodyEl.querySelectorAll(".chunk-brush").forEach(b => {
                b.addEventListener("click", () => { brush = b.getAttribute("data-brush"); clearFeedback(); });
            });
            bodyEl.querySelectorAll(".chunk-tok").forEach(tok => {
                tok.addEventListener("click", () => {
                    tok.setAttribute("data-marked", brush);
                    tok.style.background = brush === "num" ? "#DCFCE7" : "#DBEAFE";
                });
            });
            document.getElementById("chunk-next-prob").addEventListener("click", () => {
                pIdx = (pIdx + 1) % problems.length;
                clearFeedback();
                draw();
            });
            document.getElementById("chunk-verify-btn").addEventListener("click", () => {
                const toks = Array.from(bodyEl.querySelectorAll(".chunk-tok"));
                const numsOk = toks.filter(x => x.getAttribute("data-expected") === "num").every(x => x.getAttribute("data-marked") === "num");
                const goalOk = toks.filter(x => x.getAttribute("data-expected") === "goal").every(x => x.getAttribute("data-marked") === "goal");
                if (numsOk && goalOk) {
                    showFeedback("Awesome visual chunking! You separated the Numbers (Green) cleanly from the Question Goal (Blue).", true);
                } else {
                    showFeedback("Almost there! Use Green Pen on all number chunks and Blue Pen on the 'Find...' question line.", false);
                }
            });
        }
        draw();
    }

    // 2. Interactive Algebra Balance Scale
    function renderAlgebraBalance() {
        const eqs = [
            { xSide: "x", moveTerm: "+ 5", flipped: "- 5", rightStart: 12, ans: 7 },
            { xSide: "x", moveTerm: "- 4", flipped: "+ 4", rightStart: 9, ans: 13 }
        ];
        let eIdx = 0;
        let moved = false;

        function draw() {
            const eq = eqs[eIdx];
            bodyEl.innerHTML = `
                <div style="font-size: 0.88rem; font-weight: 800; color: #01463C; margin-bottom: 0.8rem;">
                    Step 1: Click the number box next to <strong>x</strong> to jump it across the middle '=' wall (its sign flips automatically!).
                </div>
                <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.75rem; align-items: center; background: #FDF7EF; border: 2px solid #01463C; border-radius: 16px; padding: 1.1rem; margin-bottom: 1rem;">
                    <div style="text-align: center; background: #FFFFFF; border: 2px solid #01463C; border-radius: 12px; padding: 0.85rem;">
                        <div style="font-size: 0.72rem; font-weight: 800; color: #537D75; text-transform: uppercase;">Left Basket</div>
                        <div style="font-size: 1.35rem; font-weight: 800; color: #01463C; margin-top: 0.25rem;">
                            ${eq.xSide} ${moved ? "" : `<button type="button" id="alg-move-btn" class="btn btn-doorbell" style="padding: 0.2rem 0.65rem; font-size: 1rem; margin-left: 0.35rem;">${eq.moveTerm} &rarr;</button>`}
                        </div>
                    </div>
                    <div style="font-size: 2rem; font-weight: 800; color: #01463C; padding: 0 0.4rem; border-left: 3px dashed #01463C; border-right: 3px dashed #01463C;">=</div>
                    <div style="text-align: center; background: #FFFFFF; border: 2px solid #01463C; border-radius: 12px; padding: 0.85rem;">
                        <div style="font-size: 0.72rem; font-weight: 800; color: #537D75; text-transform: uppercase;">Right Basket</div>
                        <div style="font-size: 1.35rem; font-weight: 800; color: #01463C; margin-top: 0.25rem;">
                            ${eq.rightStart} ${moved ? `<span style="background: #F3EEFF; border: 1.5px solid #01463C; border-radius: 8px; padding: 0.15rem 0.5rem;">${eq.flipped}</span>` : ""}
                        </div>
                    </div>
                </div>
                ${moved ? `
                <div style="display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap;">
                    <label for="alg-ans-inp" style="font-weight: 800; color: #01463C;">Step 2: Now what is x =</label>
                    <input type="number" id="alg-ans-inp" style="width: 90px; padding: 0.4rem 0.65rem; border-radius: 10px; border: 2px solid #01463C; font-weight: 800;">
                    <button type="button" id="alg-check-btn" class="btn btn-doorbell" style="padding: 0.42rem 1rem;">Check x</button>
                </div>` : ""}
                <div style="margin-top: 0.75rem;">
                    <button type="button" id="alg-switch-btn" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.35rem 0.85rem;">Try Next Equation</button>
                </div>
            `;
            const moveBtn = document.getElementById("alg-move-btn");
            if (moveBtn) {
                moveBtn.addEventListener("click", () => {
                    moved = true;
                    draw();
                    showFeedback(`Sign flipped smoothly! ${eq.moveTerm} jumped the '=' wall and turned into ${eq.flipped}.`, false);
                });
            }
            const chkBtn = document.getElementById("alg-check-btn");
            if (chkBtn) {
                chkBtn.addEventListener("click", () => {
                    const val = parseInt(document.getElementById("alg-ans-inp").value, 10);
                    if (val === eq.ans) {
                        showFeedback(`Spot on! x = ${eq.ans}. Left Basket and Right Basket match perfectly.`, true);
                    } else {
                        showFeedback(`Check the Right Basket again: compute ${eq.rightStart} ${eq.flipped} calmly.`, false);
                    }
                });
            }
            document.getElementById("alg-switch-btn").addEventListener("click", () => {
                eIdx = (eIdx + 1) % eqs.length;
                moved = false;
                clearFeedback();
                draw();
            });
        }
        draw();
    }

    // 3. Live 10-2 Calm Focus Sprint Timer + Checklist
    function renderFocusTimer() {
        let secs = 600;
        bodyEl.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <div style="font-size: 0.8rem; font-weight: 800; color: #537D75; text-transform: uppercase;">Calm Sprint Clock</div>
                    <div id="sprint-clock" style="font-size: 2.5rem; font-weight: 800; color: #01463C; font-family: monospace;">10:00</div>
                </div>
                <div style="display: flex; gap: 0.45rem; flex-wrap: wrap;">
                    <button type="button" id="sprint-start" class="btn btn-doorbell" style="font-size: 0.84rem; padding: 0.45rem 1rem;">Start Sprint</button>
                    <button type="button" id="sprint-1m" class="btn btn-secondary" style="font-size: 0.82rem; padding: 0.4rem 0.85rem;">1-Min Warm-Up</button>
                    <button type="button" id="sprint-reset" class="btn btn-secondary" style="font-size: 0.82rem; padding: 0.4rem 0.85rem;">Reset 10:00</button>
                </div>
            </div>
            <div style="display: grid; gap: 0.55rem; background: #FDF7EF; border: 2px solid #01463C; border-radius: 14px; padding: 0.9rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 700; color: #01463C;"><input type="checkbox" class="sprint-chk"> [1] I picked ONLY 3 questions for this sprint.</label>
                <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 700; color: #01463C;"><input type="checkbox" class="sprint-chk"> [2] I circled numbers and underlined the question line.</label>
                <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 700; color: #01463C;"><input type="checkbox" class="sprint-chk"> [3] I took a calm 2-minute stretch/water break after finishing.</label>
            </div>
        `;
        const clock = document.getElementById("sprint-clock");
        function fmt(s) {
            const m = String(Math.floor(s / 60)).padStart(2, "0");
            const r = String(s % 60).padStart(2, "0");
            return m + ":" + r;
        }
        document.getElementById("sprint-1m").addEventListener("click", () => { stopTimerIfRunning(); secs = 60; clock.textContent = fmt(secs); });
        document.getElementById("sprint-reset").addEventListener("click", () => { stopTimerIfRunning(); secs = 600; clock.textContent = fmt(secs); });
        document.getElementById("sprint-start").addEventListener("click", () => {
            stopTimerIfRunning();
            activeTimerId = setInterval(() => {
                if (secs > 0) {
                    secs--;
                    clock.textContent = fmt(secs);
                } else {
                    stopTimerIfRunning();
                    showFeedback("Sprint complete! Stand up, stretch, and sip water before checking answers.", true);
                }
            }, 1000);
        });
        bodyEl.querySelectorAll(".sprint-chk").forEach(c => {
            c.addEventListener("change", () => {
                const done = Array.from(bodyEl.querySelectorAll(".sprint-chk")).every(x => x.checked);
                if (done) showFeedback("All 3 micro-sprint steps checked cleanly!", true);
            });
        });
    }

    // 4. Squared Graph Paper Column Aligner
    function renderColumnGrid() {
        bodyEl.innerHTML = `
            <div style="font-size: 0.9rem; font-weight: 800; color: #01463C; margin-bottom: 0.75rem;">
                Type one digit per square box to add <strong>245 + 138</strong> without losing column alignment:
            </div>
            <div style="display: inline-grid; grid-template-columns: auto repeat(3, 56px); gap: 0.45rem; align-items: center; background: #FDF7EF; border: 2px solid #01463C; border-radius: 16px; padding: 1rem; margin-bottom: 0.85rem;">
                <div></div><div style="text-align:center;font-size:0.75rem;font-weight:800;">H</div><div style="text-align:center;font-size:0.75rem;font-weight:800;">T</div><div style="text-align:center;font-size:0.75rem;font-weight:800;">O</div>
                <div style="font-weight:800;">Row 1</div>
                <div style="background:#FFF;border:2px solid #01463C;border-radius:8px;text-align:center;padding:0.45rem;font-weight:800;">2</div>
                <div style="background:#FFF;border:2px solid #01463C;border-radius:8px;text-align:center;padding:0.45rem;font-weight:800;">4</div>
                <div style="background:#FFF;border:2px solid #01463C;border-radius:8px;text-align:center;padding:0.45rem;font-weight:800;">5</div>
                <div style="font-weight:800;">+ Row 2</div>
                <div style="background:#FFF;border:2px solid #01463C;border-radius:8px;text-align:center;padding:0.45rem;font-weight:800;">1</div>
                <div style="background:#FFF;border:2px solid #01463C;border-radius:8px;text-align:center;padding:0.45rem;font-weight:800;">3</div>
                <div style="background:#FFF;border:2px solid #01463C;border-radius:8px;text-align:center;padding:0.45rem;font-weight:800;">8</div>
                <div style="font-weight:800;">Total =</div>
                <input id="cg-h" type="text" maxlength="1" style="width:56px;text-align:center;padding:0.45rem;border:2px solid #01463C;border-radius:8px;font-weight:800;">
                <input id="cg-t" type="text" maxlength="1" style="width:56px;text-align:center;padding:0.45rem;border:2px solid #01463C;border-radius:8px;font-weight:800;">
                <input id="cg-o" type="text" maxlength="1" style="width:56px;text-align:center;padding:0.45rem;border:2px solid #01463C;border-radius:8px;font-weight:800;">
            </div>
            <div><button type="button" id="cg-check" class="btn btn-doorbell" style="font-size:0.86rem;padding:0.45rem 1.1rem;">Check Column Boxes</button></div>
        `;
        document.getElementById("cg-check").addEventListener("click", () => {
            const ans = document.getElementById("cg-h").value.trim() + document.getElementById("cg-t").value.trim() + document.getElementById("cg-o").value.trim();
            if (ans === "383") {
                showFeedback("Perfect column alignment! 245 + 138 = 383 with Ones, Tens, and Hundreds neatly separated.", true);
            } else {
                showFeedback("Recheck starting from the right Ones box (5 + 8 = 13, carry 1 to Tens).", false);
            }
        });
    }

    // 5. Interactive 3-Bullet Say-Back & Read-Aloud Builder
    function renderVoiceCardBuilder() {
        bodyEl.innerHTML = `
            <div style="font-size: 0.9rem; font-weight: 800; color: #01463C; margin-bottom: 0.7rem;">
                Speak your answer in everyday words first, then type 3 short keywords (no long paragraphs needed):
            </div>
            <div style="display: grid; gap: 0.55rem; margin-bottom: 0.85rem;">
                <input type="text" id="vb-1" placeholder="Keyword 1 (e.g., Chlorophyll captures sunlight)" style="width: 100%; padding: 0.5rem 0.8rem; border-radius: 10px; border: 1.5px solid #01463C; font-family: inherit;">
                <input type="text" id="vb-2" placeholder="Keyword 2 (e.g., Water + CO2 enter leaf)" style="width: 100%; padding: 0.5rem 0.8rem; border-radius: 10px; border: 1.5px solid #01463C; font-family: inherit;">
                <input type="text" id="vb-3" placeholder="Keyword 3 (e.g., Releases oxygen + glucose)" style="width: 100%; padding: 0.5rem 0.8rem; border-radius: 10px; border: 1.5px solid #01463C; font-family: inherit;">
            </div>
            <button type="button" id="vb-speak" class="btn btn-doorbell" style="font-size: 0.86rem; padding: 0.45rem 1.1rem;">Hear My 3-Bullet Summary Read Aloud</button>
        `;
        document.getElementById("vb-speak").addEventListener("click", () => {
            const words = [document.getElementById("vb-1").value, document.getElementById("vb-2").value, document.getElementById("vb-3").value]
                .map(s => s.trim()).filter(Boolean);
            if (words.length === 0) {
                showFeedback("Type at least 1 short keyword bullet above first.", false);
                return;
            }
            const summary = "Key points: " + words.join(". Next point: ");
            if (window.sehayakTTS) window.sehayakTTS.speak(summary, "{{ lang|default('en') }}");
            showFeedback("Great 3-bullet summary ready! Reviewing concise spoken bullets doubles recall.", true);
        });
    }

    document.querySelectorAll(".launch-online-lab-btn").forEach(btn => {
        btn.addEventListener("click", function() {
            stopTimerIfRunning();
            clearFeedback();
            activeExId = btn.getAttribute("data-ex-id");
            const tool = btn.getAttribute("data-tool") || "chunk_highlighter";
            titleEl.textContent = btn.getAttribute("data-title") || "Online Interactive Exercise";
            goalEl.textContent = btn.getAttribute("data-goal") || "";

            const refName = btn.getAttribute("data-ref-name") || "";
            const refUrl = btn.getAttribute("data-ref-url") || "";
            const extName = btn.getAttribute("data-ext-name") || "";
            const extUrl = btn.getAttribute("data-ext-url") || "";

            if (refUrl && refName) {
                refBoxEl.innerHTML = `<strong>Reference Source:</strong> <a href="${refUrl}" target="_blank" rel="noopener noreferrer" style="color: #01463C; text-decoration: underline;">${refName}</a>`;
            } else {
                refBoxEl.textContent = "Curated by School Counselor Dr. Meera Deshmukh";
            }

            if (extUrl) {
                extLinkEl.href = extUrl;
                extLinkEl.textContent = "Practice on " + (extName || "External Site") + " \u2197";
                extLinkEl.style.display = "inline-flex";
            } else {
                extLinkEl.style.display = "none";
            }

            if (tool === "algebra_balance") renderAlgebraBalance();
            else if (tool === "focus_timer") renderFocusTimer();
            else if (tool === "column_grid") renderColumnGrid();
            else if (tool === "voice_card_builder") renderVoiceCardBuilder();
            else renderChunkHighlighter();

            modal.style.display = "flex";
        });
    });

    completeBtn.addEventListener("click", async function() {
        if (!activeExId) return;
        const countEl = document.getElementById("practice-count-" + activeExId);
        try {
            const res = await fetch("/exercise/" + activeExId + "/practice", {
                method: "POST",
                headers: { "X-Requested-With": "XMLHttpRequest", "Content-Type": "application/json" }
            });
            const payload = await res.json();
            if (payload && payload.status === "success") {
                if (countEl) countEl.textContent = payload.practice_count + "x practiced";
                showFeedback("Saved! Total practice count updated to " + payload.practice_count + ".", true);
            }
        } catch (err) {
            showFeedback("Could not log completion cleanly. Check server connection.", false);
        }
    });
});
</script>
